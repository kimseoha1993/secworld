<title>신원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 왼쪽은 나라 지도(진행에 따라 안개가 걷힘), 오른쪽은 퀘스트 패널. 좁은 화면에서는 지도 위, 퀘스트 아래로 쌓인다.
   Palette: 지폐·여권의 녹색 잉크와 금박 — 금융권 세계관의 재료에서 가져옴 */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --fg:#18211D; --muted:#5B6862; --line:#CBD3CE;
  --ink:#1E5A4A; --ink-soft:#DCEBE5; --gold:#9A7426; --gold-soft:#F3E9D2;
  --land:#E6ECE7; --fog:#D5DBD7; --ok:#2E7D4F; --warn:#B4532A;
  --f-display:"Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --fg:#E2E8E4; --muted:#93A29B; --line:#2E3A35;
  --ink:#6CC1A6; --ink-soft:#1C3530; --gold:#D8B565; --gold-soft:#332A17;
  --land:#1C2521; --fog:#232C28; --ok:#6CC18A; --warn:#E08A62; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --fg:#E2E8E4; --muted:#93A29B; --line:#2E3A35;
  --ink:#6CC1A6; --ink-soft:#1C3530; --gold:#D8B565; --gold-soft:#332A17;
  --land:#1C2521; --fog:#232C28; --ok:#6CC18A; --warn:#E08A62; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin-inline:auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.75rem}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
a{color:var(--ink)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 머리 */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.top .sub{color:var(--muted);font-size:.9rem}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:.82rem}

/* 단계 트랙 — 여권 도장처럼 */
.track{display:flex;flex-wrap:wrap;gap:8px}
.stamp{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:8px 12px;text-align:left}
.stamp b{font-family:var(--f-display);font-size:.98rem;color:inherit}
.stamp small{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em}
.stamp[data-state="open"]{border-style:solid;border-color:var(--ink);color:var(--fg)}
.stamp[data-state="done"]{border-style:solid;border-color:var(--ok);color:var(--fg)}
.stamp[data-state="done"] small{color:var(--ok)}
.stamp[aria-current="step"]{background:var(--ink-soft)}
.stamp[disabled]{cursor:not-allowed;opacity:.65}

/* 본문 그리드 */
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
@media (max-width:820px){.mapbox{position:static;order:2}.quest{order:1}}
.scene-hero{display:grid;gap:14px;padding:6px 0}
.scene-hero .big{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;background:var(--gold-soft);border-radius:10px;padding:18px 20px}
.scene-hero dt{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;color:var(--gold);padding-top:4px}
.scene-hero dd{margin:0;font-family:var(--f-display);font-size:1.22rem;line-height:1.4}
.scene-hero .goal{font-size:.95rem;color:var(--muted)}
.scene-hero .goal b{color:var(--fg)}
.scene-mini{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:10px}
.scene-mini b{color:var(--fg);font-weight:500}
.realtag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl .tdesc{font-size:.82rem;color:var(--muted);margin-top:4px}
.tbl td:first-child{width:38%}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;color:var(--muted);font-weight:500;border-bottom:1.5px solid var(--line);padding:6px 8px}
.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
.tbl td:first-child{font-weight:600}
.tbl code{font-family:var(--f-mono);font-size:.82rem;color:var(--ink);background:var(--ink-soft);padding:1px 6px;border-radius:4px}
.mapbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line)}

/* 지도 SVG */
.m-country{fill:var(--land);stroke:var(--line);stroke-width:1.5}
.m-neighbor{fill:var(--land);stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 4}
.m-road{stroke:var(--line);stroke-width:2;stroke-dasharray:3 5;fill:none}
.m-region rect{fill:var(--fog);stroke:var(--line);stroke-width:1}
.m-region text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.m-region .rn{fill:var(--muted);font-family:var(--f-mono);font-size:10px;display:none}
svg.show-real .rn{display:inline}
.m-region.open rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.m-region.open text{fill:var(--fg)}
.m-region.open .rn{fill:var(--ink)}
.m-region.here rect{stroke:var(--gold);stroke-width:2.5}
.m-lock{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
.m-citizen circle{fill:var(--gold)}
.m-citizen text{fill:var(--fg);font-size:11px;font-family:var(--f-body)}
.m-title{fill:var(--muted);font-family:var(--f-display);font-size:13px}
.m-path{stroke:var(--gold);stroke-width:2;fill:none;stroke-dasharray:6 4}

/* 퀘스트 패널 */
.quest{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:18px;min-width:0}
.scene{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;background:var(--gold-soft);border-radius:8px;padding:12px 14px;font-size:.9rem}
.scene dt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;color:var(--gold);padding-top:3px}
.scene dd{margin:0}
.role{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.role b{color:var(--fg);font-weight:600}

.steps{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:6px;border-radius:3px;background:var(--line);border:0;padding:0}
.dot[aria-current="step"]{background:var(--ink)}
.dot.seen{background:var(--ink-soft)}

.card{display:grid;gap:12px}
.card .kicker{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.05em}
.prose{display:grid;gap:10px;max-width:62ch}

/* 이중 이름표 */
.dual{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px;white-space:nowrap}
.dual .w{font-weight:600;color:var(--fg);border-bottom:1.5px solid var(--gold)}
.dual .r{font-family:var(--f-mono);font-size:.78em;color:var(--ink);background:var(--ink-soft);padding:1px 6px;border-radius:4px}

/* 흐름 그림 */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;overflow-x:auto}
.node{flex:1 1 120px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:4px;background:var(--bg)}
.node .w{font-weight:600}
.node .r{font-family:var(--f-mono);font-size:.74rem;color:var(--ink)}
.node .note{font-size:.8rem;color:var(--muted)}
.arrow{align-self:center;font-family:var(--f-mono);color:var(--gold);font-size:.8rem;text-align:center;flex:0 0 auto;max-width:110px}

/* 실제 이름: 본문에서는 툴팁, 카드 아래에서는 주석 */
.term{border-bottom:1.5px dotted var(--gold);cursor:help;position:relative;font-weight:600}
.term sup{font-family:var(--f-mono);font-size:.62em;color:var(--gold);margin-left:1px;font-weight:500}
.term::after{content:attr(data-real);position:absolute;left:0;bottom:calc(100% + 6px);white-space:nowrap;font-family:var(--f-mono);font-size:.74rem;font-weight:400;background:var(--fg);color:var(--bg);padding:3px 8px;border-radius:5px;pointer-events:none;z-index:2;display:none}
.term:hover::after,.term:focus::after{display:block}
.caption{margin:0;padding:10px 0 0 1.4em;border-top:1px dashed var(--line);font-size:.8rem;color:var(--muted);display:grid;gap:2px}
.caption li::marker{font-family:var(--f-mono);color:var(--gold)}
.evidence{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px;font-size:.82rem;color:var(--muted)}
.evidence h3{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;font-weight:500;color:var(--muted)}
.evidence ol{margin:0;padding-left:1.3em;display:grid;gap:8px}
.evidence p{margin:0}
.evidence a{word-break:break-all}
.nest-row{display:flex;flex-wrap:wrap;gap:10px}
.nest{flex:2 1 260px;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.nest.ghost{flex:1 1 160px;border-style:dashed}
.nest .lbl{font-family:var(--f-display);font-weight:700}
.nest .inner{display:flex;flex-wrap:wrap;gap:8px}
.callout{border-left:3px solid var(--gold);padding:8px 12px;background:var(--bg);font-size:.92rem}
.src{font-size:.8rem;color:var(--muted);display:grid;gap:2px}
.src a{word-break:break-all}

.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);border-radius:7px;padding:8px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* 테스트 */
.test{border:1.5px solid var(--ink);border-radius:10px;padding:16px;display:grid;gap:12px}
.test .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--ink);letter-spacing:.06em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:9px 12px;cursor:pointer}
.opt input{margin-top:5px}
.match{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:480px){.mrow{grid-template-columns:minmax(0,1fr)}}
select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:110px;resize:vertical}
.fb{font-size:.92rem;padding:10px 12px;border-radius:7px;background:var(--bg)}
.fb.ok{border-left:3px solid var(--ok)}
.fb.no{border-left:3px solid var(--warn)}
.clue{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.clue button{justify-self:start;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 10px;font-size:.85rem}
.clue .found{font-size:.9rem}
.ai{white-space:pre-wrap;font-size:.92rem}
.foot{color:var(--muted);font-size:.8rem;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}

/* ---- 관계도 (어두운 게임 화면 톤, 이 칸 안에서만 쓰는 색) ---- */
.mapbox{--mb:#0F1720;--mfloor:#16222E;--mroom:#22313F;--mroomhi:#2C4152;--mline:#3B5063;--mhall:#1B2A37;--mhallhi:#4E7A8C;--mfg:#E4ECF2;--mmuted:#8FA3B4;--mtask:#F2C94C;--mopen:#7FD1AE;
  background:var(--mb);border-color:#0B1118;color:var(--mfg);padding:10px}
.mapcap{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--mmuted);padding:2px 4px}
.mapcap #mapFocus{color:var(--mtask)}
.mapbox svg{width:100%;height:auto;aspect-ratio:1118/698;display:block;background:var(--mfloor);border-radius:8px}
.rm-hall{stroke:var(--mhall);stroke-width:16;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .3s}
.rm-hall.ext{stroke-dasharray:2 14;stroke-width:10}
.rm-hall.hi{stroke:var(--mhallhi)}
.rm-hall.dim{opacity:.18}
.rm-border{fill:none;stroke:var(--mopen);stroke-width:2}
.rm-zone{fill:var(--mfg);font-size:14px;font-weight:700;font-family:var(--f-body)}
.rm-room rect.box{fill:var(--mroom);stroke:var(--mline);stroke-width:1.5;rx:6}
.rm-room.open rect.box{stroke:var(--mopen);stroke-width:2}
.rm-room.hi rect.box{fill:var(--mroomhi);stroke:var(--mtask);stroke-width:3}
.rm-room{transition:opacity .3s}
.rm-room.dim{opacity:.28}
.rm-room .nm{fill:var(--mfg);font-size:15px;font-weight:700;font-family:var(--f-body)}
.rm-lock .body{fill:var(--mmuted)}
.rm-lock .shackle{fill:none;stroke:var(--mmuted);stroke-width:2.2;stroke-linecap:round}
.rm-lock.unlocked .body{fill:var(--mopen)}
.rm-lock.unlocked .shackle{stroke:var(--mopen)}
.rm-me .pin{fill:var(--mtask);stroke:var(--mb);stroke-width:2}
.rm-me .face{fill:#FFF6D6}
.rm-me .eye{fill:#1A1A1A}
.rm-me .smile{fill:none;stroke:#1A1A1A;stroke-width:1.6;stroke-linecap:round}
.rm-me .ground{fill:var(--mtask);opacity:.55}
.rm-me .ring{fill:none;stroke:var(--mtask);stroke-width:2}
@media (prefers-reduced-motion:no-preference){.rm-me .ring{animation:rmpulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rmpulse{from{transform:scale(1);opacity:.9}to{transform:scale(3);opacity:0}}}
.mapall{justify-self:end;font:inherit;font-size:.8rem;background:transparent;color:var(--mmuted);border:1px solid var(--mline);border-radius:6px;padding:4px 10px;cursor:pointer}
.mapall[aria-pressed="true"]{color:var(--mfg);border-color:var(--mfg)}
/* 이야기 화면은 게임 대화창처럼 */
.card.story .dialog{position:relative;background:var(--fg);color:var(--bg);border-radius:10px;padding:18px 20px 16px;display:grid;gap:10px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--fg)}
.card.story .dialog .prose{max-width:none}
.card.story .dialog .speaker{position:absolute;top:-12px;left:16px;background:var(--gold);color:#1A1A1A;font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:999px}
.card.story .dialog .term{border-bottom-color:var(--gold)}
.card.story .dialog .callout{background:transparent;border-left-color:var(--gold);color:inherit}
.card.story .dialog .node{background:transparent;border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.card.story .dialog .node .note{color:inherit;opacity:.75}
.card.story .dialog .caption{color:inherit;opacity:.8;border-top-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.card.story .dialog .opt{border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.card.story .dialog .clue{border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.card.story .dialog .clue button{color:inherit;border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.main{display:block;position:relative}
.main .mapbox{position:relative;top:auto}
.main .quest{position:absolute;top:44px;max-height:calc(100% - 56px);width:34%;min-width:360px;align-content:start;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:left .35s ease,right .35s ease;z-index:3}
.main .quest[data-side="right"]{right:12px;left:auto}
.main .quest[data-side="left"]{left:12px;right:auto}
@media (max-width:820px){.main .quest{position:static;width:auto;box-shadow:none;margin-top:12px}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>신원</h1>
      <p class="sub">튜토리얼부터 다른 나라 여권까지. 비유 이름은 모두 초안입니다.</p>
    </div>
    <button class="reset" id="reset" type="button">처음부터</button>
  </header>

  <nav class="track" id="track" aria-label="단계"></nav>

  <div class="main">
    <aside class="mapbox" aria-label="관계도">
      <div class="mapcap"><span id="mapMode">일상 관계도</span><span id="mapFocus"></span></div>
      <svg id="map" viewBox="0 0 1118 698" role="img" aria-labelledby="mapTitle">
        <title id="mapTitle">관계도. 지금 화면에 해당하는 기관과 연결이 밝게 보입니다</title>
        <g id="halls"></g>
        <rect class="rm-border" x="150" y="18" width="953" height="672" rx="6"/>
        <text class="rm-zone" id="zIn" x="180" y="44">우리나라</text>
        <g id="rooms"></g>
        <g class="rm-me" id="me"><ellipse class="ring" rx="10" ry="4"/><ellipse class="ground" rx="6" ry="2.4"/><path class="pin" d="M0 0 C-4 -8 -14 -16 -14 -28 A14 14 0 1 1 14 -28 C14 -16 4 -8 0 0 Z"/><circle class="face" cx="0" cy="-28" r="9.5"/><circle class="eye" cx="-3.6" cy="-30" r="1.6"/><circle class="eye" cx="3.6" cy="-30" r="1.6"/><path class="smile" d="M-3.6 -25.2 Q0 -22 3.6 -25.2"/></g>
      </svg>
    </aside>

    <main class="quest" id="quest" aria-live="polite"></main>
  </div>

  <p class="foot">시제품입니다. 복습(간격 반복)은 아직 넣지 않았습니다. 진행 상황은 이 브라우저에만 저장됩니다.</p>
</div>

<script>
(function(){
  "use strict";

  // ---------- 근거 ----------
  var SRC = {
    rfc9110: {t:"RFC 9110 HTTP Semantics — 1.1절, 3.3절", u:"https://www.rfc-editor.org/rfc/rfc9110.html"},
    rfc6265: {t:"RFC 6265 HTTP State Management — 1장, 4.1.2.6절", u:"https://www.rfc-editor.org/rfc/rfc6265.html"},
    owasp:   {t:"OWASP Session Management Cheat Sheet", u:"https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"},
    t1539:   {t:"MITRE ATT&CK T1539 Steal Web Session Cookie", u:"https://attack.mitre.org/techniques/T1539/"},
    t1550:   {t:"MITRE ATT&CK T1550.004 Web Session Cookie", u:"https://attack.mitre.org/techniques/T1550/004/"},
    oidc:    {t:"OpenID Connect Core 1.0 — 1장, 2장, 3.1.3.7절", u:"https://openid.net/specs/openid-connect-core-1_0.html"}
  };

  // 이중 이름표 (정적 상수만 넣는다 — 사용자 입력은 절대 이 함수로 렌더하지 않는다)
  function d(w, r){ return '<span class="term" tabindex="0" data-real="'+r+'">'+w+'</span>'; }
  function flow(nodes){
    var h = '<div class="flow">';

    var g = mk("g", {"class":"rm-room"+(OPEN_ROOMS[r.id]?" open":"")}, document.getElementById("rooms"));
    r.tip = mk("title", {}, g);
    mk("rect", {"class":"box", x:r.x, y:r.y, width:r.w, height:r.h}, g);
    r.label = mk("text", {"class":"nm", x:r.x+12, y:r.y+27}, g);
    var lk = mk("g", {"class":"rm-lock"+(OPEN_ROOMS[r.id]?" unlocked":""), transform:"translate("+(r.x+18)+" "+(r.y+r.h-20)+")"}, g);
    mk("path", {"class":"shackle", d: OPEN_ROOMS[r.id] ? "M-3.5 -1 V-5 A3.5 3.5 0 0 1 3.5 -5 V-7" : "M-3.5 -1 V-5 A3.5 3.5 0 0 1 3.5 -5 V-1"}, lk);
    mk("rect", {"class":"body", x:"-6", y:"-1", width:"12", height:"9", rx:"2"}, lk);
    r.el = g;
  });

  var curVB = [0,0,1118,698], vbAnim = null;
  function setViewBox(target){
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (vbAnim) cancelAnimationFrame(vbAnim);
    if (reduce){ curVB = target; mapSvg.setAttribute("viewBox", target.join(" ")); return; }
    var from = curVB.slice(), t0 = null, dur = 450;
    function step(ts){ if (!t0) t0 = ts; var k = Math.min(1, (ts - t0) / dur); var e = 1 - Math.pow(1 - k, 3);
      curVB = from.map(function(v, i){ return v + (target[i] - v) * e; });
      mapSvg.setAttribute("viewBox", curVB.join(" ")); if (k < 1) vbAnim = requestAnimationFrame(step); }
    vbAnim = requestAnimationFrame(step);
  }

  function renderMap(){
    var s = STAGES[state.stage];
    var stp = s.steps[state.step];
    var onTest = state.step >= s.steps.length;
    var real = onTest || !!(stp && stp.real);
    var base = HL[s.id] || {r:[]};
    var hl = (stp && HL[stp.k]) || base;
    var rooms = {}; (hl.r || []).forEach(function(id){ rooms[id] = true; });
    var halls = {}; (hl.h || []).forEach(function(id){ halls[id] = true; });
    MHALLS.forEach(function(h){
      var on = halls[h.a+"-"+h.b] || halls[h.b+"-"+h.a];
      h.el.classList.toggle("hi", !!on);
      h.el.classList.toggle("dim", !on);
    });
    MROOMS.forEach(function(r){
      r.label.textContent = real ? r.rs : r.nm;
      r.tip.textContent = real ? r.nm : r.rs;
      r.el.classList.toggle("hi", !!rooms[r.id]);
      r.el.classList.toggle("dim", !rooms[r.id]);
    });
    document.getElementById("zIn").textContent = real ? "조직의 시스템" : "우리나라";
    document.getElementById("mapMode").textContent = real ? "보안 관계도" : "일상 관계도";
    document.getElementById("mapFocus").textContent = (hl.r || []).map(function(id){ return real ? MBY[id].rs : MBY[id].nm; }).join(" · ");
    var pinRoom = MBY[base.pin || "bank"];
    document.getElementById("me").setAttribute("transform", "translate(" + (pinRoom.x + pinRoom.w - 26) + " " + (pinRoom.y + pinRoom.h - 12) + ") scale(1.5)");
    // 설명 패널 위치: 강조된 기관을 가리지 않는 쪽(왼쪽/오른쪽)에 띄운다
    var W = 1118, L = [0.015 * W, 0.355 * W], R = [0.645 * W, 0.985 * W];
    function cover(span){ var c = 0; (hl.r || []).forEach(function(id){ var r = MBY[id]; c += Math.max(0, Math.min(span[1], r.x + r.w) - Math.max(span[0], r.x)) * r.h; }); return c; }
    var side = cover(R) <= cover(L) ? "right" : "left";
    document.getElementById("quest").dataset.side = side;
  }

  function el(html){ var t = document.createElement("template"); t.innerHTML = html; return t.content; }

  function renderQuest(){
    var s = STAGES[state.stage];
    var steps = s.steps;
    var onTest = state.step >= steps.length;
    questEl.textContent = "";

    renderMap();
    var head = document.createElement("div");
    head.style.display = "grid"; head.style.gap = "10px";
    var cur = !onTest ? steps[state.step] : null;
    if (!(cur && cur.scene)){
      head.append(el('<div class="scene-mini"><span>누가 <b>'+s.scene.who+'</b></span><span>어디서 <b>'+s.scene.where+'</b></span><span>무엇을 <b>'+s.scene.what+'</b></span></div>'));
    }
    var dots = document.createElement("div"); dots.className = "steps"; dots.setAttribute("aria-label","진행");
    for (var i = 0; i <= steps.length; i++){
      (function(i){
        var b = document.createElement("button"); b.type = "button"; b.className = "dot";
        b.setAttribute("aria-label", i < steps.length ? steps[i].k : "확인 테스트");
        if (i === state.step) b.setAttribute("aria-current","step"); else if (i < state.step) b.classList.add("seen");
        b.addEventListener("click", function(){ state.step = i; save(); renderQuest(); });
        dots.append(b);
      })(i);
    }
    head.append(dots);
    questEl.append(head);

    var card = document.createElement("section"); card.className = "card";
    if (!onTest){
      var st = steps[state.step];
      if (st.scene){
        card.append(el(
          '<div class="scene-hero"><div class="kicker">'+s.label+' · 장면</div>'+
          '<h2>먼저 이 장면을 머릿속에 두세요</h2>'+
          '<dl class="big"><dt>누가</dt><dd>'+s.scene.who+'</dd><dt>어디서</dt><dd>'+s.scene.where+'</dd><dt>무엇을</dt><dd>'+s.scene.what+'</dd></dl>'+
          '<p class="goal">이번 단계에서 알게 될 것 · <b>'+s.goal+'</b></p></div>'));
      } else {
        if (!st.real){
          card.classList.add("story");
          card.append(el('<div class="kicker">'+st.k+'</div><div class="dialog"><span class="speaker">이야기</span><h2>'+st.h+'</h2>'+st.body+'</div>'));
        } else {
          card.append(el('<div class="kicker">'+st.k+'<span class="realtag">실제 대응</span></div><h2>'+st.h+'</h2>'+st.body));
        }
      }
      var terms = card.querySelectorAll(".term");
      if (terms.length){
        var seen = {}, list = [];
        terms.forEach(function(t){
          var key = t.textContent + "|" + t.dataset.real;
          if (!seen[key]){ list.push({w:t.textContent, r:t.dataset.real}); seen[key] = list.length; }
          var sup = document.createElement("sup"); sup.textContent = String(seen[key]); t.append(sup);
          t.setAttribute("aria-label", t.firstChild.textContent + ", 실제 이름 " + t.dataset.real);
        });
        var cap = document.createElement("ol"); cap.className = "caption";
        list.forEach(function(x){ var li = document.createElement("li"); li.textContent = x.w + " = " + x.r; cap.append(li); });
        card.append(cap);
      }
    } else {
      card.append(renderTest(s));
    }
    questEl.append(card);

    if (s.id === "2" && !onTest && steps[state.step].k === "2-2 · 단서") renderClues();

    var nav = document.createElement("div"); nav.className = "nav";
    var prev = document.createElement("button"); prev.type = "button"; prev.className = "btn ghost"; prev.textContent = "이전";
    prev.disabled = state.step === 0;
    prev.addEventListener("click", function(){ state.step--; save(); renderQuest(); });
    nav.append(prev);
    if (!onTest){
      var next = document.createElement("button"); next.type = "button"; next.className = "btn";
      next.textContent = state.step === steps.length - 1 ? "확인 테스트로" : "다음";
      next.addEventListener("click", function(){ state.step++; save(); renderQuest(); });
      nav.append(next);
    } else if (state.done[s.id] && state.stage < STAGES.length - 1){
      var go = document.createElement("button"); go.type = "button"; go.className = "btn go";
      go.textContent = STAGES[state.stage+1].label + "로";
      go.addEventListener("click", function(){ state.stage++; state.step = 0; save(); render(); });
      nav.append(go);
    }
    questEl.append(nav);

    if (!onTest){
      var cur2 = steps[state.step];
      var notes = cur2.notes || [];
      if (notes.length){
        var ev = document.createElement("section"); ev.className = "evidence";
        var eh = document.createElement("h3"); eh.textContent = "근거"; ev.append(eh);
        var ol = document.createElement("ol");
        notes.forEach(function(n){
          var li = document.createElement("li");
          var p = document.createElement("p"); p.textContent = n.t;
          var a = document.createElement("a"); a.href = SRC[n.s].u; a.target = "_blank"; a.rel = "noopener"; a.textContent = SRC[n.s].t;
          li.append(p, a); ol.append(li);
        });
        ev.append(ol); questEl.append(ev);
      }
    }
  }

  // 2단계 단서
  var CLUES = [
    {t:"신분증 확인 기록", f:"어젯밤 박OO의 신분증으로 신분 확인을 한 기록이 없음. 실패한 시도도 없음."},
    {t:"확인 문자 발송 기록", f:"어젯밤에는 확인 문자를 보낼 일 자체가 없었음."},
    {t:"출입증 사용 기록", f:"어젯밤 이체 요청에 박OO의 출입증 번호가 쓰였음. 그런데 요청이 온 곳은 박OO가 평소 쓰는 곳이 아님."},
    {t:"출입 기록부", f:"박OO의 출입증 번호가 신청서 주소 칸에 적힌 채로 기록부에 그대로 남아 있음. 기록부를 볼 수 있는 사람이면 누구나 번호를 알 수 있었음."}
  ];
  function renderClues(){
    var box = document.getElementById("clues"); if (!box) return;
    CLUES.forEach(function(c){
      var w = document.createElement("div"); w.className = "clue";
      var h = document.createElement("b"); h.textContent = c.t;
      var b = document.createElement("button"); b.type = "button"; b.textContent = "열어 보기";
      var f = document.createElement("p"); f.className = "found"; f.textContent = c.f; f.hidden = true;
      b.addEventListener("click", function(){ f.hidden = false; b.hidden = true; });
      w.append(h, b, f); box.append(w);
    });
  }

  function pass(s){ state.done[s.id] = true; save(); renderTrack(); renderMap(); }

  function renderTest(s){
    var t = s.test;
    var box = document.createElement("div"); box.className = "test";
    var tag = document.createElement("div"); tag.className = "tag"; tag.textContent = t.tag;
    var q = document.createElement("p"); q.style.fontWeight = "600"; q.textContent = t.q;
    box.append(tag, q);
    var fb = document.createElement("div"); fb.className = "fb"; fb.hidden = true;

    if (t.type === "choice" || t.type === "diag"){
      var opts = document.createElement("div"); opts.className = "opts";
      t.opts.forEach(function(o, i){
        var lab = document.createElement("label"); lab.className = "opt";
        var r = document.createElement("input"); r.type = "radio"; r.name = "q-"+s.id; r.value = String(i); r.id = "q-"+s.id+"-"+i;
        var sp = document.createElement("span"); sp.textContent = o;
        lab.append(r, sp); opts.append(lab);
      });
      box.append(opts);
      var reason;
      if (t.type === "diag"){
        var rl = document.createElement("label"); rl.htmlFor = "reason-2"; rl.textContent = "이유";
        reason = document.createElement("textarea"); reason.id = "reason-2"; reason.placeholder = "왜 그렇게 판단했는지 적어 보세요";
        box.append(rl, reason);
      }
      var check = document.createElement("button"); check.type = "button"; check.className = "btn"; check.textContent = "확인";
      check.style.justifySelf = "start";
      var model = document.createElement("div"); model.className = "fb"; model.hidden = true;
      check.addEventListener("click", function(){
        var sel = box.querySelector('input[name="q-'+s.id+'"]:checked');
        fb.hidden = false;
        if (!sel){ fb.className = "fb no"; fb.textContent = "답을 하나 골라 주세요."; return; }
        if (t.type === "diag" && reason.value.trim().length < 10){ fb.className = "fb no"; fb.textContent = "이유를 한두 문장 적어 주세요. 고르기만 하면 설명 연습이 되지 않습니다."; return; }
        var right = Number(sel.value) === t.a;
        fb.className = "fb " + (right ? "ok" : "no");
        fb.textContent = right ? t.ok : t.no;
        if (right){
          if (t.type === "diag"){ model.hidden = false; model.textContent = "모범 답: " + t.model; }
          pass(s); renderQuestNavOnly();
        }
      });
      box.append(check, fb, model);
    }

    if (t.type === "match"){
      var reals = t.rows.map(function(r){ return r[1]; });
      var shuffled = reals.slice().sort(function(a,b){ return a.localeCompare(b, "ko"); });
      var grid = document.createElement("div"); grid.className = "match";
      var selects = [];
      t.rows.forEach(function(r, i){
        var row = document.createElement("div"); row.className = "mrow";
        var lab = document.createElement("label"); lab.htmlFor = "m-"+i; lab.textContent = r[0];
        lab.style.fontWeight = "600";
        var sel = document.createElement("select"); sel.id = "m-"+i;
        var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "실제 이름 고르기"; sel.append(o0);
        shuffled.forEach(function(x){ var o = document.createElement("option"); o.value = x; o.textContent = x; sel.append(o); });
        row.append(lab, sel); grid.append(row); selects.push(sel);
      });
      box.append(grid);
      var mc = document.createElement("button"); mc.type = "button"; mc.className = "btn"; mc.textContent = "확인"; mc.style.justifySelf = "start";
      mc.addEventListener("click", function(){
        var all = true;
        selects.forEach(function(sel, i){
          var ok = sel.value === t.rows[i][1];
          sel.style.borderColor = ok ? "var(--ok)" : "var(--warn)";
          if (!ok) all = false;
        });
        fb.hidden = false; fb.className = "fb " + (all ? "ok" : "no"); fb.textContent = all ? t.ok : t.no;
        if (all){ pass(s); renderQuestNavOnly(); }
      });
      box.append(mc, fb);
    }

    if (t.type === "write"){
      var wl = document.createElement("label"); wl.htmlFor = "w-3"; wl.textContent = "내 설명";
      var ta = document.createElement("textarea"); ta.id = "w-3"; ta.placeholder = "발급국, 수신국, 서명 중 무엇을 왜 확인하는지 포함해서";
      var row = document.createElement("div"); row.style.display = "flex"; row.style.flexWrap = "wrap"; row.style.gap = "8px";
      var show = document.createElement("button"); show.type = "button"; show.className = "btn"; show.textContent = "모범 답과 비교하기";
      var ask = document.createElement("button"); ask.type = "button"; ask.className = "btn ghost"; ask.textContent = "Claude에게 채점받기"; ask.hidden = true;
      var model2 = document.createElement("div"); model2.className = "fb"; model2.hidden = true;
      var ai = document.createElement("div"); ai.className = "fb ai"; ai.hidden = true;
      show.addEventListener("click", function(){
        if (ta.value.trim().length < t.min){ fb.hidden = false; fb.className = "fb no"; fb.textContent = "먼저 내 말로 설명을 적어 주세요. 모범 답을 먼저 보면 설명 테스트가 의미 없어집니다."; return; }
        fb.hidden = true;
        model2.hidden = false; model2.className = "fb ok"; model2.textContent = "모범 답: " + t.model;
        pass(s); renderQuestNavOnly();
      });
      row.append(show, ask);
      box.append(wl, ta, row, fb, model2, ai);

      // Claude 채점 — claude.ai에서 열었을 때만 보인다
      if (window.claude && typeof window.claude.use === "function"){
        window.claude.use("sample").then(function(sample){
          if (!sample) return;
          ask.hidden = false;
          ask.addEventListener("click", function(){
            var ans = ta.value.trim();
            if (ans.length < t.min){ fb.hidden = false; fb.className = "fb no"; fb.textContent = "먼저 내 말로 설명을 적어 주세요."; return; }
            ask.disabled = true; ai.hidden = false; ai.textContent = "읽는 중...";
            var prompt = "너는 보안 개념 학습의 채점자다. 학습자가 쓴 설명을 아래 기준과 대조해 한국어로 짧게 피드백해라.\n"+
              "형식: 첫 줄에 '충족 n/3'. 이어서 기준마다 한 줄씩 [충족] 또는 [빠짐]과 근거. 마지막에 고칠 점 한 문장. 칭찬이나 인사는 넣지 마라.\n\n"+
              "질문: " + t.q + "\n\n기준:\n1) 이웃 나라(IdP)가 인증하고 결과를 여권(ID 토큰)으로 발급한다는 구조를 설명했는가\n2) 받는 쪽이 발급국(iss)과 수신국(aud)을 확인한다는 것을 말했는가\n3) 발급국 서명을 검증한다는 것을 말했는가\n\n"+
              "학습자 답:\n" + ans.slice(0, 4000);
            sample(prompt, {modelTier:"quick", onText:function(u){ ai.textContent = u.text; }})
              .then(function(r){ ai.textContent = r.text; })
              .catch(function(e){
                var c = e && e.code;
                if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled" || c === "capability_removed"){ ask.hidden = true; ai.textContent = "이 화면에서는 Claude 채점을 쓸 수 없습니다. 모범 답과 직접 비교해 주세요."; }
                else if (c === "rate_limited"){ ai.textContent = "요청이 많습니다. 잠시 뒤 다시 눌러 주세요."; }
                else if (c === "cancelled"){ ai.hidden = true; }
                else { ai.textContent = (e && e.text ? e.text + "\n\n" : "") + "채점이 중간에 끊겼습니다. 다시 눌러 주세요."; }
              })
              .then(function(){ ask.disabled = false; });
          });
        }).catch(function(){});
      }
    }
    return box;
  }

  function renderQuestNavOnly(){
    // 통과 후 다음 단계 버튼만 다시 그린다 (입력한 답은 그대로 둔다)
    var nav = questEl.querySelector(".nav"); if (!nav) return;
    if (nav.querySelector(".go")) return;
    if (state.stage < STAGES.length - 1){
      var go = document.createElement("button"); go.type = "button"; go.className = "btn go";
      go.textContent = STAGES[state.stage+1].label + "로";
      go.addEventListener("click", function(){ state.stage++; state.step = 0; save(); render(); });
      nav.append(go);
    } else {
      var end = document.createElement("span"); end.className = "go"; end.textContent = "신원을 모두 통과했습니다.";
      end.style.alignSelf = "center"; end.style.color = "var(--ok)";
      nav.append(end);
    }
  }

  function render(){ renderTrack(); renderMap(); renderQuest(); }

  document.getElementById("reset").addEventListener("click", function(){
    state = {stage:0, step:0, done:{}}; save(); render();
  });

  render();
})();
</script>
